# Development docker compose with hot-reload
services:
  db:
    image: postgres:15-alpine
    container_name: ${DATABASE_CONTAINER_NAME:-go_api_db}
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-grab}
    # No ports exposed to host - only accessible within Docker network
    expose:
      - "${DATABASE_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - go_api_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: ${HEALTH_CHECK_INTERVAL:-15s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-5s}
      retries: ${HEALTH_CHECK_RETRIES:-5}
      start_period: ${HEALTH_CHECK_START_PERIOD:-15s}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development  # Use development stage
    container_name: ${APP_CONTAINER_NAME:-go_api_app}
    environment:
      - DOCKER_ENV=true
      - SKIP_INTEGRATION_TESTS=true
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8180}:${SERVER_PORT:-8180}"
    volumes:
      # Mount source code for hot-reload in development
      - ./:/app
      - /app/tmp  # Exclude tmp directory
    depends_on:
      db:
        condition: service_healthy
    networks:
      - go_api_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${SERVER_PORT:-8180}/health/live || exit 1"]
      interval: ${HEALTH_CHECK_INTERVAL:-10s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-5s}
      retries: ${HEALTH_CHECK_RETRIES:-5}
    restart: unless-stopped

  web:
    image: node:24-alpine
    container_name: ${WEB_CONTAINER_NAME:-go_api_web}
    working_dir: /app
    environment:
      - API_PROXY_TARGET=http://app:${SERVER_PORT:-8180}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-0}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - go_api_network
    restart: unless-stopped
    # node:24-alpine has no curl; node 24 has fetch.
    # Makes the E2E startup deterministic (service_healthy).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s # covers the npm install of the first boot (empty volume)

  e2e:
    # Tag must exactly match the pinned @playwright/test version in web/package.json
    # (drift symptom: "Executable doesn't exist"). Browsers are preinstalled.
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    container_name: ${E2E_CONTAINER_NAME:-go_api_e2e}
    profiles: ["e2e"]
    working_dir: /app
    environment:
      - E2E_BASE_URL=http://web:5173
    volumes:
      - ./web:/app
      # glibc ≠ musl: dedicated volume, NEVER reuse web_node_modules.
      - e2e_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - go_api_network

networks:
  go_api_network:
    driver: bridge

volumes:
  postgres_data:
  web_node_modules:
  e2e_node_modules:
